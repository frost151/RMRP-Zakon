<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 256px; height: 256px; background: transparent; overflow: hidden; }
    .ic {
      position: absolute; inset: 8px; border-radius: 52px;
      background: radial-gradient(circle at 50% 35%, #263552, #0d1320 75%);
      box-shadow: inset 0 0 0 3px rgba(143, 163, 187, .35);
      display: grid; place-items: center; color: #c9a227;
    }
    .ic svg { width: 150px; height: 180px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
  </style>
</head>
<body>
  <div class="ic" id="ic"></div>
  <script src="../src/renderer/emblems.js"></script>
  <script>document.getElementById('ic').innerHTML = window.emblem('lawyer', { small: true });</script>
</body>
</html>
